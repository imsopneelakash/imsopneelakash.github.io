<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Portal (TMDB + Archive.org)</title>
    <style>
        /* General Reset & Body */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #141414;
            color: #fff;
            font-family: Arial, sans-serif;
            line-height: 1.6;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        h1 {
            color: #e50914;
            text-align: center;
            margin-bottom: 20px;
            font-size: 2.5rem;
            letter-spacing: 1px;
        }

        /* Search Bar */
        #searchInput {
            width: 100%;
            padding: 12px 20px;
            border-radius: 4px;
            border: none;
            margin-bottom: 30px;
            font-size: 1rem;
            background-color: #333;
            color: #fff;
        }
        #searchInput::placeholder {
            color: #aaa;
        }

        /* Movie Grid */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 15px;
        }
        .card {
            background: #181818;
            border-radius: 4px;
            overflow: hidden;
            transition: transform 0.2s ease-in-out;
            cursor: pointer;
        }
        .card:hover {
            transform: scale(1.05);
            z-index: 10;
        }
        .card img {
            width: 100%;
            height: 225px;
            object-fit: cover;
            display: block;
        }
        .title {
            padding: 10px;
            font-size: 0.9rem;
            text-align: center;
            color: #e5e5e5;
        }

        /* Archive Player Section */
        .ia-movie-player-container {
            background: #181818;
            padding: 25px;
            border-radius: 8px;
            margin-bottom: 40px;
            max-width: 950px;
            margin-left: auto;
            margin-right: auto;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.6);
            text-align: center;
            border: 1px solid #333;
        }
        .ia-movie-player-container h2 {
            color: #e50914;
            margin-bottom: 15px;
            font-size: 1.8rem;
        }
        .ia-movie-player-container h3 {
            color: #fff;
            margin-bottom: 5px;
            font-size: 1.2rem;
        }
        .ia-movie-player-container p {
            color: #aaa;
            margin-bottom: 20px;
            font-style: italic;
        }
        .ia-movie-player-container iframe {
            width: 100%;
            height: 500px;
            border-radius: 4px;
            background: #000;
        }
        .download-btn-container {
            margin-top: 20px;
        }
        .download-btn {
            display: inline-block;
            padding: 12px 30px;
            background-color: #e50914;
            color: #fff;
            text-decoration: none;
            border-radius: 4px;
            font-weight: bold;
            font-size: 1rem;
            transition: background-color 0.3s;
        }
        .download-btn:hover {
            background-color: #b2070f;
        }
        .hint-text {
            color: #888;
            font-size: 0.8rem;
            margin-top: 10px;
        }

        /* Modal Styles */
        #modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            z-index: 100;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            padding: 20px;
            overflow-y: auto;
        }
        #modal-content {
            max-width: 800px;
            width: 100%;
            background: #181818;
            border-radius: 8px;
            overflow: hidden;
            position: relative;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.7);
            animation: fadeIn 0.3s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }
        #close-modal {
            position: absolute;
            top: 15px;
            right: 20px;
            font-size: 2.5rem;
            color: #fff;
            cursor: pointer;
            z-index: 101;
            transition: color 0.2s;
        }
        #close-modal:hover {
            color: #e50914;
        }
        .movie-detail {
            display: flex;
            gap: 25px;
            padding: 25px;
            align-items: flex-start;
        }
        .poster {
            width: 200px;
            border-radius: 4px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.5);
        }
        .info {
            flex: 1;
            color: #e5e5e5;
        }
        .info h2 {
            color: #fff;
            margin-bottom: 10px;
            font-size: 1.8rem;
        }
        .rating {
            color: #46d369;
            font-weight: bold;
            margin-bottom: 15px;
            font-size: 1.1rem;
        }
        .info p {
            margin-bottom: 12px;
            font-size: 0.95rem;
            line-height: 1.5;
        }
        .info strong {
            color: #fff;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🎬 Movie Portal</h1>

    <!-- Internet Archive Movie Player Section (Featured Movie) -->
    <div class="ia-movie-player-container">
        <h2>Featured Public Domain Movie</h2>
        <h3>Metropolis (1927)</h3>
        <p>A silent German expressionist epic, widely regarded as one of the greatest films of all time.</p>
        
        <!-- Archive.org Embed Player -->
        <iframe
            src="https://archive.org/embed/Metropolis1927"
            width="100%"
            height="500"
            frameborder="0"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
            allowfullscreen
            style="border-radius: 4px; background: black;">
        </iframe>

        <!-- Direct Download Button -->
        <div class="download-btn-container">
            <a href="https://archive.org/download/Metropolis1927/metropolis-1927-1080p.mp4" download target="_blank" class="download-btn">
                ⬇️ Download Movie (MP4 Quality)
            </a>
            <p class="hint-text">*Clicking download will open the direct archive.org link in a new tab to save the file.</p>
        </div>
    </div>

    <!-- Search Section -->
    <div style="margin-bottom: 30px; text-align: center;">
        <input type="text" id="searchInput" placeholder="Search for movies on TMDB (e.g. Inception, Batman, Sci-Fi)...">
    </div>

    <!-- Movie Grid -->
    <div id="movieGrid" class="grid">
        <!-- Cards will be dynamically injected here by JavaScript -->
    </div>
</div>

<!-- Movie Details Modal -->
<div id="modal">
    <span id="close-modal">&times;</span>
    <div id="modal-content" class="movie-detail">
        <!-- Dynamic content goes here -->
    </div>
</div>

<script>
    const API_KEY = "2bf42ad205de782a19d0864ffa1cfd2c";
    const searchInput = document.getElementById('searchInput');
    const movieGrid = document.getElementById('movieGrid');
    const modal = document.getElementById('modal');
    const closeModal = document.getElementById('close-modal');
    const modalContent = document.getElementById('modal-content');

    let searchTimeout;

    // Search listener with debounce
    searchInput.addEventListener('input', (e) => {
        clearTimeout(searchTimeout);
        const query = e.target.value.trim();
        if (query.length < 2) {
            movieGrid.innerHTML = "";
            return;
        }
        searchTimeout = setTimeout(() => fetchMovies(query), 500);
    });

    async function fetchMovies(query) {
        try {
            const response = await fetch(`https://api.themoviedb.org/3/search/movie?api_key=${API_KEY}&query=${encodeURIComponent(query)}`);
            const data = await response.json();
            displayMovies(data.results);
        } catch (err) {
            console.error("Error fetching movies:", err);
            movieGrid.innerHTML = "<p style='grid-column: 1/-1; text-align: center; color: red;'>Failed to fetch movies. Please check your API key or connection.</p>";
        }
    }

    function displayMovies(movies) {
        movieGrid.innerHTML = "";
        if (!movies || movies.length === 0) {
            movieGrid.innerHTML = "<p style='grid-column: 1/-1; text-align: center; color: #888;'>No movies found matching your query.</p>";
            return;
        }
        movies.forEach(movie => {
            const card = document.createElement('div');
            card.className = 'card';
            const posterPath = movie.poster_path 
                ? `https://image.tmdb.org/t/p/w500${movie.poster_path}` 
                : 'https://via.placeholder.com/150x225/333/fff?text=No+Image';
            
            card.innerHTML = `
                <img src="${posterPath}" alt="${movie.title}">
                <div class="title">${movie.title} (${new Date(movie.release_date).getFullYear() || 'N/A'})</div>
            `;
            card.onclick = () => showMovieDetails(movie);
            movieGrid.appendChild(card);
        });
    }

    async function showMovieDetails(movie) {
        modalContent.innerHTML = `<span id="close-modal">&times;</span><div style="text-align:center; padding:50px; color:#fff;">Loading details...</div>`;
        modal.style.display = 'flex';

        try {
            const [movieRes, creditsRes] = await Promise.all([
                fetch(`https://api.themoviedb.org/3/movie/${movie.id}?api_key=${API_KEY}`),
                fetch(`https://api.themoviedb.org/3/movie/${movie.id}/credits?api_key=${API_KEY}`)
            ]);
            
            if (!movieRes.ok || !creditsRes.ok) {
                throw new Error("Failed to fetch details from TMDB.");
            }

            const details = await movieRes.json();
            const credits = await creditsRes.json();
            
            const director = credits.crew.find(person => person.job === 'Director')?.name || 'Unknown';
            const cast = credits.cast.slice(0, 5).map(c => c.name).join(', ');

            const posterPath = details.poster_path 
                ? `https://image.tmdb.org/t/p/w500${details.poster_path}` 
                : 'https://via.placeholder.com/200x300/333/fff?text=No+Image';

            modalContent.innerHTML = `
                <span id="close-modal">&times;</span>
                <img src="${posterPath}" class="poster" alt="${details.title}">
                <div class="info">
                    <h2>${details.title} <span style="color:#888; font-weight:normal; font-size:1.1rem;">(${new Date(details.release_date).getFullYear() || 'N/A'})</span></h2>
                    <p class="rating">⭐ Rating: ${details.vote_average}/10</p>
                    <p><strong>Director:</strong> ${director}</p>
                    <p><strong>Top Cast:</strong> ${cast}</p>
                    <p><strong>Plot Summary:</strong> ${details.overview}</p>
                    <p><strong>Genres:</strong> ${details.genres.map(g => g.name).join(', ')}</p>
                </div>
            `;
            
            // Re-attach close listener to the newly generated span
            document.getElementById('close-modal').onclick = () => modal.style.display = 'none';
        } catch (err) {
            console.error("Error loading details:", err);
            modalContent.innerHTML = `<span id="close-modal">&times;</span><div style="text-align:center; padding:50px; color:red;">Failed to load movie details. Please try again later.</div>`;
            document.getElementById('close-modal').onclick = () => modal.style.display = 'none';
        }
    }

    // Close modal when clicking outside of it
    window.onclick = (e) => {
        if (e.target === modal) {
            modal.style.display = 'none';
        }
    }
</script>

</body>
</html>
